name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: curaciones_test
          POSTGRES_USER: curaciones
          POSTGRES_PASSWORD: curaciones
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://curaciones:curaciones@localhost:5432/curaciones_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test -- --ci

      # `npm test` uses the jest block in package.json, whose rootDir is `src`,
      # so everything under `test/` was outside the gate — including the whole
      # org-isolation net. See test/jest-e2e-ci.cjs for why this needs its own
      # config and which suites it excludes.
      - run: npm run test:e2e:ci
        env:
          DATABASE_URL: postgresql://curaciones:curaciones@localhost:5432/curaciones_test

      - run: npm run build

  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
