name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: curaciones_test
          POSTGRES_USER: curaciones
          POSTGRES_PASSWORD: curaciones
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://curaciones:curaciones@localhost:5432/curaciones_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test -- --ci

      # `npm test` uses the jest block in package.json, whose rootDir is `src`,
      # so everything under `test/` was outside the gate — including the whole
      # org-isolation net. See test/jest-e2e-ci.cjs for why this needs its own
      # config and which suites it excludes.
      #
      # Its own database, because it cannot share one with `npm test`:
      # src/oauth/adapters/postgres.adapter.spec.ts runs with `synchronize: true`,
      # which creates the schema without recording anything in `migrations`.
      # `pretest:e2e` then migrates from scratch and dies on `CREATE TYPE` with
      # 42710, the type already existing. A separate database keeps the two
      # schema-management strategies from colliding.
      - name: Create the e2e database
        run: PGPASSWORD=curaciones psql -h localhost -U curaciones -d postgres -c 'CREATE DATABASE curaciones_e2e OWNER curaciones'

      - run: npm run test:e2e:ci
        env:
          TEST_DATABASE_URL: postgresql://curaciones:curaciones@localhost:5432/curaciones_e2e
          DATABASE_URL: postgresql://curaciones:curaciones@localhost:5432/curaciones_e2e

      - run: npm run build

  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
